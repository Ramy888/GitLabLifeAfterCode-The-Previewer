server {
  listen ${PORT};
  root /usr/share/nginx/html;

  # go_router uses path URLs, so unknown paths fall back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location ~* \.(js|css|png|svg|ico|woff2?|wasm)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
