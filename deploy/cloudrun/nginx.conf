server {
  listen ${PORT};
  root /usr/share/nginx/html;

  # go_router uses path URLs, so unknown paths fall back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Flutter's entry files keep the same names across builds: always revalidate them.
  location ~* ^/(index\.html|main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    expires 1d;
    add_header Cache-Control "public";
  }
}
