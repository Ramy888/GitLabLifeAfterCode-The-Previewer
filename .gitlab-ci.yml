# The Previewer pipeline.
# test -> build -> review -> package -> deploy
# Release MRs from the Duo flow use branches named store-review/<version>: their pipeline validates the human's
# inputs and builds the per-store packages. Merging that MR is the human's approval of the outcome: the merge
# pipeline on the default branch then tags v<version> and publishes the GitLab Release (release:gitlab).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # The flow pushes fix and release branches before opening their MRs; the MR pipeline covers them.
    - if: $CI_COMMIT_BRANCH =~ /^store-review(-fix)?\//
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    # Tags are created by release:gitlab, which already published the release from the merge pipeline.

.release-merge: &release-merge
  if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /Merge branch 'store-review\/\d/

stages: [test, build, review, package, deploy]

variables:
  FLUTTER_IMAGE: ghcr.io/cirruslabs/flutter:3.41.9
  PYTHON_IMAGE: python:3.12-slim
  ENGINE_DIR: tools/store_review

default:
  interruptible: true

.engine:
  image: $PYTHON_IMAGE
  before_script:
    - pip install --quiet uv==0.11.3
    - cd $ENGINE_DIR && uv sync --quiet && cd $CI_PROJECT_DIR
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [$ENGINE_DIR/.venv]

.flutter:
  image: $FLUTTER_IMAGE
  before_script:
    - sh tools/ci/firebase_options.sh
    - flutter pub get
  cache:
    key: pub-$CI_COMMIT_REF_SLUG
    paths: [.pub-cache]
  variables:
    PUB_CACHE: $CI_PROJECT_DIR/.pub-cache

engine:test:
  extends: .engine
  stage: test
  script:
    - cd $ENGINE_DIR && uv run pytest -q --junitxml=$CI_PROJECT_DIR/engine-junit.xml
  artifacts:
    when: always
    reports:
      junit: engine-junit.xml

flutter:test:
  extends: .flutter
  stage: test
  script:
    - flutter analyze --no-fatal-infos
    - flutter test

build:web:
  extends: .flutter
  stage: build
  needs: [flutter:test]
  script:
    - flutter build web --release
    # deploy.sh refuses a build made with the stub Firebase config.
    - if [ -f .firebase-options-stub ]; then touch build/web/.firebase-options-stub; fi
  artifacts:
    paths: [build/web]
    expire_in: 1 week

build:android:
  extends: .flutter
  stage: build
  needs: [flutter:test]
  rules:
    - if: $ANDROID_KEYSTORE_BASE64
  script:
    - sh tools/ci/android_signing.sh
    - flutter build appbundle --release
    - echo "AAB_JOB_ID=$CI_JOB_ID" > aab.env
  artifacts:
    paths: [build/app/outputs/bundle/release/app-release.aab]
    reports:
      dotenv: aab.env
    expire_in: 90 days

review:benchmark:
  extends: .engine
  stage: review
  needs: [engine:test]
  script:
    - cd $ENGINE_DIR && uv run store-review benchmark --out $CI_PROJECT_DIR/benchmark.json
  artifacts:
    paths: [benchmark.json]

review:scan:
  extends: .engine
  stage: review
  needs: [engine:test, review:benchmark]
  script:
    - cd $ENGINE_DIR
    - uv run store-review scan --app $CI_PROJECT_DIR --out $CI_PROJECT_DIR/findings.json
        --report $CI_PROJECT_DIR/review-report.md --benchmark $CI_PROJECT_DIR/benchmark.json
    - uv run store-review handoff --findings $CI_PROJECT_DIR/findings.json | tee $CI_PROJECT_DIR/handoff.md
    - echo "SCAN_JOB_ID=$CI_JOB_ID" > $CI_PROJECT_DIR/scan.env
  artifacts:
    paths: [findings.json, review-report.md, handoff.md]
    reports:
      dotenv: scan.env
    expose_as: store review
    expire_in: 90 days

review:inputs:
  extends: .engine
  stage: review
  needs: [engine:test]
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^store-review\/\d/
    - *release-merge
  script:
    - cd $ENGINE_DIR && uv run store-review validate-inputs --app $CI_PROJECT_DIR

package:stores:
  extends: .engine
  stage: package
  needs: [review:scan, review:inputs]
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^store-review\/\d/
    - *release-merge
  script:
    - cd $ENGINE_DIR
    # The approved version comes from the merged release branch name (store-review/<version>).
    - echo "RELEASE_VERSION=$(printf '%s' "$CI_COMMIT_MESSAGE" | sed -n "s|.*Merge branch 'store-review/\([0-9][^']*\)'.*|\1|p" | head -n 1)" > $CI_PROJECT_DIR/release.env
    - echo "PACKAGE_JOB_ID=$CI_JOB_ID" >> $CI_PROJECT_DIR/release.env
    # Exit 4 (a store still blocked) is allowed; any other failure must fail the job whatever the store order.
    - blocked=0; broken=0
    - for store in ios android; do
        code=0;
        uv run store-review package --store $store --findings $CI_PROJECT_DIR/findings.json --app $CI_PROJECT_DIR
          --out $CI_PROJECT_DIR/dist/store-package || code=$?;
        if [ $code -eq 4 ]; then blocked=1; elif [ $code -ne 0 ]; then broken=1; fi;
      done
    - if [ $broken -eq 1 ]; then exit 1; fi
    - if [ $blocked -eq 1 ]; then exit 4; fi
  allow_failure:
    exit_codes: [4]
  artifacts:
    when: always  # keep the unblocked store's package when the other store exits 4
    paths: [dist/store-package]
    reports:
      dotenv: release.env
    expire_in: 90 days

release:gitlab:
  stage: package
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  interruptible: false  # a newer push must not cancel a release half-way
  needs:
    - package:stores
    - review:scan
    - job: build:android
      optional: true
  rules:
    - *release-merge
  script:
    - test -n "$RELEASE_VERSION" || { echo "No store-review/<version> branch in the merge commit message" >&2; exit 1; }
    - echo "Creating release v$RELEASE_VERSION at $CI_COMMIT_SHA"
  release:
    tag_name: v$RELEASE_VERSION
    ref: $CI_COMMIT_SHA
    name: "Store review v$RELEASE_VERSION"
    description: review-report.md
    assets:
      links:
        - name: Store packages
          url: "$CI_PROJECT_URL/-/jobs/$PACKAGE_JOB_ID/artifacts/browse/dist/store-package"
        - name: findings.json
          url: "$CI_PROJECT_URL/-/jobs/$SCAN_JOB_ID/artifacts/raw/findings.json"
        - name: Android app bundle (AAB)
          url: "$CI_PROJECT_URL/-/jobs/$AAB_JOB_ID/artifacts/raw/build/app/outputs/bundle/release/app-release.aab"

notify:release:
  extends: .engine
  stage: deploy
  interruptible: false
  allow_failure: true  # the release is already published; a mail outage must not mark it failed
  needs: [release:gitlab, review:scan, package:stores]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /Merge branch 'store-review\/\d/ && $CLOUDFLARE_EMAIL_TOKEN
  script:
    - cd $ENGINE_DIR
    - uv run store-review notify --findings $CI_PROJECT_DIR/findings.json
        --release-url $CI_PROJECT_URL/-/releases/v$RELEASE_VERSION --to $NOTIFY_EMAIL_TO

deploy:cloudrun:
  stage: deploy
  image: google/cloud-sdk:slim
  interruptible: false  # a newer push must not cancel a rollout half-way
  needs: [build:web]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT_ID
      when: manual
  id_tokens:
    GCP_ID_TOKEN:
      aud: $GCP_WIF_AUDIENCE
  script:
    - sh deploy/cloudrun/deploy.sh
  environment:
    name: production
    url: $CLOUD_RUN_URL
