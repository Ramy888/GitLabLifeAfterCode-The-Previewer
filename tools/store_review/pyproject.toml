[project]
name = "store-review"
version = "0.1.0"
description = "Rehearse Apple App Store and Google Play review for a Flutter app before submission."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
store-review = "store_review.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["store_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
